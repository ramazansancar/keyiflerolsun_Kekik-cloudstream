# Bu araç @keyiflerolsun tarafından | @KekikAkademi için yazılmıştır.
 name: CloudStream Derleyici
 concurrency:
   group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
   cancel-in-progress: true
 
 on:
   workflow_dispatch:
   push:
     branches:
       - master
     paths-ignore:
       - "**/*.md"
       - "**/*.yml"
       - "**/*.jpg"
       - "**/*.png"
       - "**/*.py"
 
 jobs:
   CloudStreamDerleyici:
     runs-on: ubuntu-latest
     steps:
       - name: "'src' Depo Kontrolü"
         uses: actions/checkout@v6
         with:
           path: "src"
 
       - name: "'build' Depo Kontrolü"
         uses: actions/checkout@v6
         with:
           ref: "builds"
           path: "builds"
 
       - name: Eski Derlemeleri Temizle
         run: rm $GITHUB_WORKSPACE/builds/*.cs3 || true
 
       - name: JDK 17 Ayarla
         uses: actions/setup-java@v5
         with:
           distribution: temurin
           java-version: 17

       - name: Setup Gradle
         uses: gradle/actions/setup-gradle@v5
         with:
           cache-read-only: false
 
       - name: Eklentileri Derle
         run: |
           cd $GITHUB_WORKSPACE/src
           chmod +x gradlew
           ./gradlew make makePluginsJson -x :RecTV:make
           cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
           cp build/plugins.json $GITHUB_WORKSPACE/builds

       - name: RecTV
         run: |
           PLUGINS=$GITHUB_WORKSPACE/builds/plugins.json
           # url: feroxx → patr0nq/patr0n-cs
           sed -i 's|https://raw.githubusercontent.com/feroxx/Kekik-cloudstream/builds/RecTV.cs3|https://raw.githubusercontent.com/patr0nq/patr0n-cs/builds/RecTV.cs3|g' "$PLUGINS"
           # repositoryUrl: feroxx → patr0nq/patr0n-cs (sadece RecTV bloğunda)
           python3 - <<EOF
           import json, re
           with open("$PLUGINS", "r", encoding="utf-8") as f:
               data = json.load(f)
           for p in data:
               if p.get("internalName") == "RecTV":
                   p["repositoryUrl"] = "https://github.com/patr0nq/patr0n-cs"
           with open("$PLUGINS", "w", encoding="utf-8") as f:
               json.dump(data, f, indent=4, ensure_ascii=False)
           EOF

       - name: '@KekikAkademi ifadesini değiştir'
         run: |
           sed -i 's/@KekikAkademi/@feroxxcs3/g' $GITHUB_WORKSPACE/builds/repo.json
 
       - name: Derlemeleri Yükle
         run: |
           cd $GITHUB_WORKSPACE/builds
           git config --local user.email "actions@github.com"
           git config --local user.name "GitHub Actions"
            git add .
            git commit --amend -m "$GITHUB_SHA 'nın Derlenmesi" || exit 0   # eğer commit edilecek bir şey yoksa hata verme
            git push --force 
